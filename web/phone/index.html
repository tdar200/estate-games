<html lang="en">

<body class="phone-app">
  <div id="app" class="app">
    <header id="header" class="header"></header>
    <div id="banner" class="banner-slot" aria-live="polite"></div>
    <section id="boardview" class="boardview" hidden aria-label="Board">
      <div id="board" class="pboard"></div>
    </section>
    <div id="status" class="status-slot" aria-live="polite" hidden></div>
    <main id="main" class="main"><p class="loading">Finding your table…</p></main>
    <div id="nav" class="nav-slot"></div>
  </div>
  <div id="cues" class="cue-toasts" aria-live="polite"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>
  <dialog id="sheet" class="sheet" aria-label="Details"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
